# Keep the SHA-pinned GitHub Actions (and app dependencies) current. Pinning the
# release workflow's actions to commit SHAs blocks a hijacked tag from injecting
# into the published binary; Dependabot opens PRs to bump those pins (and npm /
# cargo deps) so the pins don't silently rot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    # Security-only would be ideal; weekly keeps the small tree fresh.

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(rust)"
