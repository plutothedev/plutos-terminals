# Keep the SHA-pinned GitHub Actions (and app dependencies) current. Pinning the
# release workflow's actions to commit SHAs blocks a hijacked tag from injecting
# into the published binary; Dependabot opens PRs to bump those pins (and npm /
# cargo deps) so the pins don't silently rot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    # Wait a week after a release before proposing it: a hijacked or broken
    # version is usually yanked within days. Security updates are not delayed.
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    # Security-only would be ideal; weekly keeps the small tree fresh.
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    # Wait a week after a release before proposing it: a hijacked or broken
    # version is usually yanked within days. Security updates are not delayed.
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(rust)"
    # Wait a week after a release before proposing it: a hijacked or broken
    # version is usually yanked within days. Security updates are not delayed.
    cooldown:
      default-days: 7
