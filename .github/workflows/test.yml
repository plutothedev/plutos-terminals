# (C) Test gate (added during the P2 perf stream after review found NOTHING in
# CI ran the suites — 343 vitest + 147 cargo tests were guarding nothing).
name: test
# push-only (stream audit W5: push + pull_request double-ran every suite on
# PR branches). windows runner (W4): the keyring crate has only apple/windows
# backend features enabled — a linux build hits its no-backend compile_error;
# windows also mirrors the primary dev/ship platform.
on:
  push:
    branches: ["**"]
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml
