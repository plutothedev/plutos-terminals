# Dependency vulnerability scanning — npm (frontend) + cargo-audit (Rust backend).
# Runs on pushes/PRs to the working branches, weekly, and on demand.
#
# Posture: the scan is now a GATE. cargo-audit fails the job on any
# vulnerability-class advisory EXCEPT the explicitly-ignored known residual set
# below (each unfixable upstream or capped by a parent crate's semver, each with
# a reason). So a newly-disclosed advisory turns CI red instead of hiding in a
# wall of perennial noise. Warnings (unmaintained/unsound/yanked — the gtk-rs
# GTK3 Linux stack, etc.) are not errors in cargo-audit and stay informational.
#
# When a fix lands upstream: drop the matching --ignore line and let the bump
# flow through Cargo.lock (that's how crossbeam-epoch RUSTSEC-2026-0204 and
# quinn-proto RUSTSEC-2026-0185 already left the list — a plain `cargo update`).

name: audit

on:
  push:
    branches: [main, 001-remote-sessions-parity]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC — catch newly-disclosed advisories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Shipped risk only (dev tooling like vite/vitest doesn't reach users),
      # gate-worthy severity. Blocking: production deps must be clean at high+.
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

  cargo-audit:
    name: cargo audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-audit binary
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-bin-v1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      # Cargo.lock lives under src-tauri (this is a Tauri app, not a workspace root).
      # --ignore = known residual advisories, each unfixable or parent-capped:
      #   RUSTSEC-2023-0071  rsa "Marvin" timing side-channel. No patched release
      #     since 2023. Transitive (SSH keygen); the attack needs a remote
      #     decryption oracle with fine timing, which this desktop app doesn't
      #     expose — keygen is local + one-shot.
      #   RUSTSEC-2026-0194 / -0195  quick-xml quadratic-attr + namespace-alloc
      #     DoS. Fixed >=0.41.0 but tauri/plist pins 0.39.x (cargo update caps at
      #     0.39.4). XML input is app-authored config, not hostile streams.
      #   RUSTSEC-2026-0235  rkyv OOB read on a malicious archive. Fixed >=0.8.17
      #     but parent-capped. We never deserialize untrusted rkyv archives.
      - name: cargo audit
        working-directory: src-tauri
        run: >
          cargo audit
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
          --ignore RUSTSEC-2026-0235
