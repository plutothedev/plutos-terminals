# Dependency vulnerability scanning — npm (frontend) + cargo-audit (Rust backend).
# Runs on pushes/PRs to the working branches, weekly, and on demand.
#
# Posture: continue-on-error is TRUE for now. The Rust tree carries known
# advisories with no fixed upstream version yet — notably rsa RUSTSEC-2023-0071
# (the "Marvin" timing side-channel, still no patched release) and the
# unmaintained `vnc 0.4.0` crate. The scan REPORTS them so they stay visible; it
# does not block. Once the tree is clean, or the residual unfixable advisories
# are explicitly acknowledged in src-tauri/audit.toml ([advisories] ignore = [...]),
# flip continue-on-error to false to gate merges on a clean scan.
name: audit

on:
  push:
    branches: [main, 001-remote-sessions-parity]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC — catch newly-disclosed advisories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Shipped risk only (dev tooling like vite/vitest doesn't reach users),
      # gate-worthy severity. continue-on-error keeps it reporting, not blocking.
      - name: npm audit (production deps, high+)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  cargo-audit:
    name: cargo audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-audit binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-bin-v1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      # Cargo.lock lives under src-tauri (this is a Tauri app, not a workspace root).
      - name: cargo audit
        continue-on-error: true
        working-directory: src-tauri
        run: cargo audit
