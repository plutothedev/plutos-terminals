# (C) Static analysis — added 2026-08-21 during the full audit.
#
# Why this file exists: before today the repo had NO JavaScript linter, no type
# system, and no license policy. ~30,000 lines of JSX went unchecked by anything
# except the human eye, and clippy was installed but never gated.
#
# Posture: every job BLOCKS. `licenses` has blocked since birth (2026-08-21;
# it passed clean across the Windows, Linux and macOS dependency trees from day
# one). eslint, knip, clippy and semgrep started as reporters
# (continue-on-error) because each had a real backlog on 2026-08-21 (eslint 279
# errors, clippy 3 warnings, knip 24, semgrep 31), and gating them then would
# have painted CI red permanently, which teaches everyone to ignore CI. The
# v0.7.6 cleanup drove all four to zero, so as of v0.7.6 they block too, with no
# allowance: eslint fails on any warning, clippy on any warning (-D warnings),
# semgrep on any finding. A check that reports but never fails is not honest
# about the tree, so none are left in that state.
#
# All actions are pinned to commit SHAs, matching release.yml, audit.yml and
# test.yml (all four pinned since the 2026-08-21 audit fixes).

name: static

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eslint:
    name: eslint (react-hooks + jsx-a11y)
    runs-on: ubuntu-latest
    # BLOCKING since v0.7.6: the tree went from 279 errors / 56 warnings
    # (2026-08-21 baseline: accessibility plus react-hooks/* and
    # require-atomic-updates correctness) to 0 / 0. --max-warnings 0 keeps
    # warnings from piling back up unseen.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: eslint
        run: npx eslint . -f stylish --max-warnings 0

  knip:
    name: knip (dead code + unused deps)
    runs-on: ubuntu-latest
    # BLOCKING since v0.7.6: the known-good entries knip cannot see on its own
    # (companion-web vendored into the Rust binary via include_str!,
    # public/boot.js, .claude/hooks, tests/fixtures/mock_mcp_server.mjs) are
    # declared in its config and the remaining count is 0, so any new dead file,
    # unused export or unlisted dependency fails the run.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Pinned (the version the 0-finding baseline was taken with): a blocking
      # job must not turn red because a new knip release changed its rules.
      # Bump it on purpose and fix what it finds in the same change.
      - run: npx --yes knip@6.47.0 --reporter symbols

  clippy:
    name: cargo clippy (${{ matrix.os }})
    # BLOCKING since v0.7.6 with -D warnings: the 2026-08-21 backlog (3
    # default-lint warnings) is closed and the crate is warning-free, so any new
    # warning fails the run.
    # Two legs because a lint only sees code its target compiles. windows-latest
    # matches test.yml's primary leg (the ship platform). macos-latest lints the
    # cfg(unix) / cfg(not(windows)) / macOS-only code (the sshconfig.rs askpass
    # helper, the unix paths in commands.rs, sftp.rs, companion.rs, sync_git.rs,
    # ...) that the Windows leg never compiles. It mirrors test.yml's rust-macos
    # leg, which compiles this crate there with no extra setup; that leg's
    # setup-node only serves the mock MCP server tests/mcp_mock.rs spawns at run
    # time, and clippy runs nothing. Linux is still not a CI leg
    # (cost/never-been-built call, not a compile_error: Cargo.toml enables
    # sync-secret-service).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Pinned for the lint gate only (the crate's rust-version is 1.94):
          # with -D warnings, a new stable release that adds a default lint
          # would fail CI on unchanged code. Bump on purpose, fix in one change.
          toolchain: 1.94.1
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          # One cache per leg, as in test.yml; a shared key would thrash.
          key: ${{ matrix.os }}
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  licenses:
    name: cargo-deny licenses (BLOCKING)
    runs-on: ubuntu-latest
    # This one blocks. Verified 2026-08-21 against the x86_64-pc-windows-msvc,
    # x86_64-unknown-linux-gnu and x86_64-apple-darwin dependency trees: zero
    # third-party rejections. cargo-audit checks advisories only and would not
    # notice a GPL/AGPL crate entering a proprietary, statically-vendored binary.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Cache cargo-deny binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-bin-v1
      - name: Install cargo-deny
        # Install only when the cache did not restore it; a failed install then
        # fails here, instead of "|| true" hiding it until "command not found".
        run: command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked
      - name: cargo deny check licenses
        working-directory: src-tauri
        run: cargo deny check licenses

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    # BLOCKING since v0.7.6 (--error exits non-zero on any finding): the
    # 2026-08-21 backlog of 31 is at 0, the mutable-action-tag findings closed
    # when every workflow was SHA-pinned, and the known-good hits carry reasoned
    # nosemgrep annotations at the line.
    # --exclude=.specify: spec-kit helper scripts, not app source; semgrep's
    # bash and PowerShell parsers cannot parse them, so they only add parse
    # errors (7) to the output.
    # --timeout=30: the default is 5 s per rule per file, and on a timeout
    # semgrep SKIPS that rule on that file without failing the scan. Under full
    # load the express-ssrf rule timed out on
    # src/features/terminals/TerminalPane.jsx, so that rule was silently not
    # checking that file.
    # Local OSS engine only: rules are downloaded, source is never uploaded.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Pinned engine (the version the 0-finding baseline was taken with). The
      # p/* rulesets are still fetched live from the registry, so a new rule can
      # still surface a finding: that is the point of the gate.
      - run: pip install semgrep==1.174.0
      - name: semgrep scan
        run: >
          semgrep scan --metrics=off --error
          --config=p/javascript --config=p/react --config=p/rust
          --config=p/secrets --config=p/owasp-top-ten --config=p/command-injection
          --exclude=node_modules --exclude=dist --exclude=target
          --exclude=design-mockups --exclude=.specify
          --timeout=30
