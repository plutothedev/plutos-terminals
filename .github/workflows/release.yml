# Build Pluto's Terminal installers for macOS and Windows and publish them as a
# GitHub Release. (Linux is cut from the matrix below — see the comment there
# for why and for the exact conditions to re-enable it.)
#
# Hybrid distribution: this workflow lives in the PRIVATE source repo and
# publishes the compiled installers to a PUBLIC "releases" repo so the
# community can download without ever seeing the source.
#
# Required repo configuration (Settings → Secrets and variables → Actions):
#   • Variable RELEASES_REPO  = owner/repo of the PUBLIC releases repo
#                               (e.g. plutothedev/plutos-terminals).
#                               If unset, it publishes to THIS repo.
#   • Secret   RELEASES_TOKEN = a fine-grained PAT with "Contents: read/write"
#                               on the public releases repo. Only needed when
#                               RELEASES_REPO differs from this repo.
#
# Trigger: push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`)
# or run it manually from the Actions tab.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin"
          # ── Linux is CUT from the release matrix (deliberate, reversible) ──
          # It shipped on every previous release and has never been executed by
          # CI or by hand: test.yml runs cargo on windows-latest only (the
          # keyring crate had no Linux backend), so the .deb/.AppImage were
          # built by a machine and run by nobody. Until tonight it also
          # SILENTLY DESTROYED saved credentials there (keyring fell back to an
          # in-memory mock, and the frontend read a successful empty get as
          # proof the keychain worked, then stripped the plaintext copy), and
          # it carries a canvas renderer verified only on Windows.
          #
          # Re-enable when ALL of these hold:
          #   1. test.yml has a Linux cargo leg that passes.
          #   2. Someone has actually booted the AppImage and saved + reloaded
          #      a credential across a restart (proves sync-secret-service is
          #      really linked, not just declared).
          #   3. Terminal glyphs are confirmed to render on the canvas renderer
          #      there, or TerminalPane's IS_MAC gate is widened to keep Linux
          #      on the DOM renderer.
          # - platform: ubuntu-22.04
          #   rust-targets: ""
          #   # rpm needs rpmbuild on the runner; ship deb + AppImage.
          #   args: "--bundles deb,appimage"
          - platform: windows-latest
            rust-targets: ""
            # NSIS template chokes on the apostrophe in the product name; MSI is fine.
            args: "--bundles msi"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libdbus-1-dev: keyring's Linux backend (sync-secret-service) reaches the
          # Secret Service over D-Bus. It may arrive transitively via gtk, but relying
          # on that makes credential storage a silent build-order accident.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libudev-dev libdbus-1-dev

      - name: Install npm deps
        run: npm ci

      - name: Build the app + installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          # Signs the updater artifacts. Without these the build still produces
          # installers, but the .sig files are missing and latest.json cannot be
          # assembled, so the updater silently never offers anything. See
          # docs/updater.md for generating the key and setting these secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # tauri.release.conf.json is a RELEASE-ONLY overlay holding
          # createUpdaterArtifacts + the updater pubkey/endpoints. It is kept out
          # of the base tauri.conf.json on purpose: the bundler refuses to build
          # when a pubkey is configured without TAURI_SIGNING_PRIVATE_KEY ("A
          # public key has been found, but no private key"), which would break
          # every local `npm run tauri build` for anyone without the signing key.
          # Confining it here means local builds stay clean and only CI signs.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-installers
          # Copy every produced installer/bundle, regardless of target dir layout.
          # *.zip and *.sig are the UPDATER artifacts (createUpdaterArtifacts):
          # the signed payload the updater downloads, plus its minisign
          # signature, which latest.json embeds. Without them the updater has
          # nothing to verify and silently never offers an update.
          find src-tauri/target -type f \( \
            -name "*.dmg" -o -name "*.app.tar.gz" -o \
            -name "*.msi" -o -name "*.exe" -o \
            -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o \
            -name "*.zip" -o -name "*.sig" \
          \) -path "*/bundle/*" -exec cp {} dist-installers/ \; || true
          ls -la dist-installers

      - name: Upload installers artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.platform }}
          path: dist-installers/*
          if-no-files-found: warn

  publish:
    needs: build
    # Only auto-publish on a version tag push; manual (workflow_dispatch) runs
    # just build + upload artifacts so a maintainer can publish deliberately.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download all installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: all-installers
          merge-multiple: true

      - name: List artifacts
        run: ls -laR all-installers

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd all-installers
          # GitHub rewrites release-asset names, mapping every char outside
          # [A-Za-z0-9._-] to "." — so "Pluto's Terminal_0.6.0_x64_en-US.msi" is
          # served as "Pluto.s.Terminal_0.6.0_x64_en-US.msi". Hashing the ORIGINAL
          # names produced a SHA256SUMS that named files no downloader could ever
          # have on disk: `sha256sum -c` failed 5/5 with "No such file or
          # directory", while the README makes that check the ONLY integrity proof
          # before telling Windows users to click through SmartScreen.
          # Fix: sanitize the names OURSELVES first, so what we hash is exactly
          # what GitHub serves and there is no mangling left to predict.
          for f in *; do
            [ -f "$f" ] || continue
            [ "$f" = SHA256SUMS ] && continue
            clean=$(printf '%s' "$f" | tr -c 'A-Za-z0-9._-' '.')
            if [ "$f" != "$clean" ]; then
              if [ -e "$clean" ]; then
                echo "::error::sanitized name collision: '$f' -> '$clean'"
                exit 1
              fi
              mv -- "$f" "$clean"
              echo "renamed: $f -> $clean"
            fi
          done
          # Hash into a path OUTSIDE this directory: writing the sums file here
          # while globbing it would race the glob against the redirect.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z \
            | xargs -0 -r sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          echo "SHA256SUMS:"; cat SHA256SUMS
          # Prove it verifies against the exact bytes we are about to upload —
          # a green run now means a user's `sha256sum -c` will also pass.
          sha256sum -c SHA256SUMS

      - name: Build updater manifest (latest.json)
        shell: bash
        env:
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: |
          set -euo pipefail
          cd all-installers
          # The updater endpoint in tauri.conf.json points at this file. It maps
          # each platform to a signed payload URL + its minisign signature.
          # MUST run AFTER the sanitize step above: the URLs have to be the names
          # GitHub actually serves, not the pre-upload ones.
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "manual run — skipping latest.json (no real tag to point at)"
            exit 0
          fi
          TARGET_REPO="${RELEASES_REPO:-$GITHUB_REPOSITORY}"
          VERSION="${TAG#v}"

          shopt -s nullglob
          sigs=(*.sig)
          if [ ${#sigs[@]} -eq 0 ]; then
            # Unsigned build: TAURI_SIGNING_PRIVATE_KEY was not set. Publish the
            # installers anyway rather than failing the release, but make the
            # reason loud — a missing latest.json means the updater silently
            # never offers anything, which is exactly the failure it exists to
            # prevent.
            echo "::warning::no .sig files found — TAURI_SIGNING_PRIVATE_KEY is probably unset, so NO latest.json is published and auto-update stays dark. See docs/updater.md."
            exit 0
          fi

          platforms='{}'
          for sig in "${sigs[@]}"; do
            payload="${sig%.sig}"
            if [ ! -f "$payload" ]; then
              echo "::warning::signature $sig has no matching payload $payload — skipping"
              continue
            fi
            # Platform keys must match what the RUNTIME asks for. The updater
            # builds its lookup key from cfg!(target_arch) at compile time, so a
            # lipo'd universal macOS binary resolves to darwin-aarch64 or
            # darwin-x86_64 depending on which slice is executing — NEVER
            # "darwin-universal". Publishing only that key made check() fail with
            # TargetsNotFound, which the UI could not distinguish from "no update
            # available", so macOS would silently never update. Emit BOTH arch
            # keys pointing at the same universal payload + signature.
            case "$payload" in
              *.app.tar.gz) keys="darwin-aarch64 darwin-x86_64" ;;
              *.msi.zip)    keys="windows-x86_64" ;;
              *)            echo "::notice::ignoring non-updater artifact $payload"; continue ;;
            esac
            url="https://github.com/${TARGET_REPO}/releases/download/${TAG}/${payload}"
            for key in $keys; do
              platforms=$(jq -n --argjson p "$platforms" --arg k "$key" \
                --arg sig "$(cat "$sig")" --arg url "$url" \
                '$p + {($k): {signature: $sig, url: $url}}')
            done
          done

          if [ "$(jq -r 'length' <<<"$platforms")" = "0" ]; then
            echo "::warning::found .sig files but none matched a known updater payload — no latest.json published"
            exit 0
          fi

          jq -n --arg v "$VERSION" --arg notes "See the release notes for $TAG." \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: $p}' > latest.json
          echo "latest.json:"; cat latest.json

      - name: Publish GitHub Release
        env:
          # Cross-repo publish to the public releases repo when configured,
          # otherwise publish to this repo with the built-in token.
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then TAG="manual-$(date +%Y%m%d-%H%M%S)"; fi
          TARGET_REPO="${RELEASES_REPO:-$GITHUB_REPOSITORY}"
          echo "Publishing $TAG to $TARGET_REPO"
          gh release create "$TAG" \
            --repo "$TARGET_REPO" \
            --title "Pluto's Terminal $TAG" \
            --notes "Download the installer for your platform below. macOS: .dmg, Windows: .msi. Builds are unsigned, so your OS may prompt on first launch; verify your download against the attached SHA256SUMS before running (see the README Install section)." \
            all-installers/* || \
          gh release upload "$TAG" --repo "$TARGET_REPO" --clobber all-installers/*
