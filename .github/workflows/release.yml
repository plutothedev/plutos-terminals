# Build Pluto's Terminal installers for macOS and Windows and publish them as a
# GitHub Release. (Linux is cut from the matrix below — see the comment there
# for why and for the exact conditions to re-enable it.)
#
# Hybrid distribution: this workflow exists on BOTH remotes. On the public repo
# (origin, plutothedev/plutos-terminals) RELEASES_REPO is unset and it publishes
# to itself; on the private mirror (plutos-terminals-app) RELEASES_REPO points
# at the public repo. So push a release tag to ONE remote only, origin: a tag on
# both remotes starts two runs that race to publish the same release (the
# second `gh release create` fails and falls back to `upload --clobber`, which
# silently replaces the first run's signed assets). v0.6.1 was published from
# origin.
#
# Required repo configuration (Settings → Secrets and variables → Actions):
#   • Variable RELEASES_REPO  = owner/repo of the PUBLIC releases repo
#                               (e.g. plutothedev/plutos-terminals).
#                               If unset, it publishes to THIS repo.
#   • Secret   RELEASES_TOKEN = a fine-grained PAT with "Contents: read/write"
#                               on the public releases repo. Only needed when
#                               RELEASES_REPO differs from this repo.
#
# Triggers, and what each one actually does:
#   • A version tag PUSH (`git tag v0.2.0 && git push origin v0.2.0`) is the
#     only thing that publishes a release. Everything below keys off the event,
#     not the ref.
#   • A manual dispatch from the Actions tab builds the matrix and leaves the
#     installers as downloadable workflow artifacts. It never publishes: the
#     publish job is gated on `github.event_name == 'push'`, because every
#     in-shell gate disarms itself on a dispatch (the tag/source version check
#     skips, latest.json skips, and the publish step invents a manual-<date>
#     tag), so a dispatch that reached publish would ship a signed,
#     version-unverified release with no updater manifest. Use it to test the
#     build; tag the commit when you want it released.
#
# The release PROCEDURE itself (version bump, tag, what CI asserts, and the
# recovery when a build leg or the signing secret fails) is canonical in
# CLAUDE.md under "Release process". It is deliberately not restated here or in
# docs/updater.md: three copies of it is how those three files drifted apart.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin"
          # ── Linux is CUT from the release matrix (deliberate, reversible) ──
          # It shipped on every previous release and has never been executed by
          # CI or by hand: test.yml runs cargo on windows-latest and macos-latest,
          # never Linux, so the .deb/.AppImage were built by a machine and run by
          # nobody. (That macOS leg was added for the symlink-escape tests, not
          # for this; condition 1 below still wants a Linux leg specifically.) Until tonight it also
          # SILENTLY DESTROYED saved credentials there (keyring fell back to an
          # in-memory mock, and the frontend read a successful empty get as
          # proof the keychain worked, then stripped the plaintext copy), and
          # it carries a canvas renderer verified only on Windows.
          #
          # Re-enable when ALL of these hold:
          #   1. test.yml has a Linux cargo leg that passes.
          #   2. Someone has actually booted the AppImage and saved + reloaded
          #      a credential across a restart (proves sync-secret-service is
          #      really linked, not just declared).
          #   3. Terminal glyphs are confirmed to render on the canvas renderer
          #      there, or TerminalPane's IS_MAC gate is widened to keep Linux
          #      on the DOM renderer.
          # - platform: ubuntu-22.04
          #   rust-targets: ""
          #   # rpm needs rpmbuild on the runner; ship deb + AppImage.
          #   args: "--bundles deb,appimage"
          - platform: windows-latest
            rust-targets: ""
            # NSIS template chokes on the apostrophe in the product name; MSI is fine.
            args: "--bundles msi"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # latest.json's version is taken from the git ref (publish job below)
      # while the installer is stamped from SOURCE, and nothing used to make the
      # two agree. Tag a commit whose three version files still read the old
      # number and every client is offered a version it can never reach: it
      # downloads, installs the OLDER build, relaunches unchanged, and is
      # re-offered the identical update forever. Not hypothetical: the v0.6.0
      # tag names a commit whose three files all say 0.1.32, and it was harmless
      # only because that commit predates this workflow. Cheap, so it runs
      # before the build: a mistyped bump costs seconds, not a whole matrix.
      - name: Assert the tag matches the source version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "manual run, skipping the tag/source version check (no real tag to compare)"
            exit 0
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Top-level key only: both JSON files nest other "version" keys deeper
          # and Cargo.toml repeats `version = ` for every dependency, so anchor
          # on the exact top-level indentation / on the [package] section.
          PKG=$(awk -F'"' '/^  "version":/ {print $4; exit}' package.json)
          CARGO=$(awk '/^\[/ {pkg = ($0 == "[package]")} pkg && /^version[[:space:]]*=/ {gsub(/"/, "", $3); print $3; exit}' src-tauri/Cargo.toml)
          CONF=$(awk -F'"' '/^  "version":/ {print $4; exit}' src-tauri/tauri.conf.json)
          echo "tag=${TAG_VERSION} package.json=${PKG} Cargo.toml=${CARGO} tauri.conf.json=${CONF}"
          # An unreadable value counts as a mismatch: a silently-empty
          # extraction would otherwise switch this gate off the day one of the
          # three files is reformatted.
          bad=""
          check() {
            if [ -z "$2" ]; then bad="$bad $1(unreadable)"
            elif [ "$2" != "$TAG_VERSION" ]; then bad="$bad $1($2)"; fi
          }
          check package.json "$PKG"
          check src-tauri/Cargo.toml "$CARGO"
          check src-tauri/tauri.conf.json "$CONF"
          if [ -n "$bad" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} disagrees with the source version in:$bad. The installer is stamped from source and latest.json from the tag, so publishing this would leave every client in a permanent update loop on an older build. Bump all three files to ${TAG_VERSION} (see the release process in CLAUDE.md) and re-tag."
            exit 1
          fi
          echo "tag and all three version files agree on ${TAG_VERSION}"

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libdbus-1-dev: keyring's Linux backend (sync-secret-service) reaches the
          # Secret Service over D-Bus. It may arrive transitively via gtk, but relying
          # on that makes credential storage a silent build-order accident.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libudev-dev libdbus-1-dev

      - name: Install npm deps
        run: npm ci

      - name: Build the app + installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # Signs the updater artifacts. Without these the build still produces
          # installers, but the .sig files are missing and latest.json cannot be
          # assembled, so the updater silently never offers anything. See
          # docs/updater.md for generating the key and setting these secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # tauri.release.conf.json is a RELEASE-ONLY overlay holding
          # createUpdaterArtifacts + the updater pubkey/endpoints. It is kept out
          # of the base tauri.conf.json on purpose: the bundler refuses to build
          # when a pubkey is configured without TAURI_SIGNING_PRIVATE_KEY ("A
          # public key has been found, but no private key"), which would break
          # every local `npm run tauri build` for anyone without the signing key.
          # Confining it here means local builds stay clean and only CI signs.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-installers
          # Copy every produced installer/bundle, regardless of target dir layout.
          # *.zip and *.sig are the UPDATER artifacts (createUpdaterArtifacts):
          # the signed payload the updater downloads, plus its minisign
          # signature, which latest.json embeds. Without them the updater has
          # nothing to verify and silently never offers an update.
          find src-tauri/target -type f \( \
            -name "*.dmg" -o -name "*.app.tar.gz" -o \
            -name "*.msi" -o -name "*.exe" -o \
            -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o \
            -name "*.zip" -o -name "*.sig" \
          \) -path "*/bundle/*" -exec cp {} dist-installers/ \; || true
          ls -la dist-installers

      - name: Upload installers artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.platform }}
          path: dist-installers/*
          if-no-files-found: warn

  publish:
    needs: build
    # Only auto-publish on a version tag PUSH. The EVENT matters as much as the
    # ref: a workflow_dispatch can be launched from a tag (`gh workflow run
    # --ref` takes "Branch or tag name", and the Run-workflow dropdown has a
    # Tags tab), so a ref-only guard let a manual run reach this job. Every
    # gate below then disarmed itself on workflow_dispatch: the tag/source
    # version check skipped, latest.json skipped, and the publish step renamed
    # the tag to manual-<date> and shipped every installer anyway. That is a
    # complete, signed, version-unverified release with no updater manifest at
    # all. Manual runs stop at build + upload artifacts, so a maintainer
    # publishes deliberately.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download all installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: all-installers
          merge-multiple: true

      - name: List artifacts
        run: ls -laR all-installers

      # The one completeness check that must NOT depend on signing. Every other
      # guard lives inside the latest.json step below, which exits early when no
      # .sig files are present, so an unsigned release used to skip the only
      # assertion that a platform's installer is actually here. Combined with
      # `if-no-files-found: warn` on the upload above (a leg that produced
      # nothing still goes green) that shipped a release quietly missing a
      # platform. Assert the installers first, on their own, unconditionally.
      # This list is kept in step with the build matrix by hand, same as the
      # platform-key list further down; deriving both from the matrix is the
      # real fix and is why re-enabling the Linux leg means editing both.
      - name: Assert every matrix platform produced an installer
        shell: bash
        run: |
          set -euo pipefail
          cd all-installers
          shopt -s nullglob
          missing=""
          macos=(*.dmg)
          windows=(*.msi)
          [ ${#macos[@]} -gt 0 ]   || missing="$missing macos-latest(.dmg)"
          [ ${#windows[@]} -gt 0 ] || missing="$missing windows-latest(.msi)"
          if [ -n "$missing" ]; then
            echo "::error::the release is missing an installer for:$missing. That build leg produced nothing and went green anyway. Artifacts present: $(ls | tr '\n' ' ')"
            exit 1
          fi
          echo "an installer is present for every platform in the build matrix"

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd all-installers
          # GitHub rewrites release-asset names, mapping every char outside
          # [A-Za-z0-9._-] to "." — so "Pluto's Terminal_0.6.0_x64_en-US.msi" is
          # served as "Pluto.s.Terminal_0.6.0_x64_en-US.msi". Hashing the ORIGINAL
          # names produced a SHA256SUMS that named files no downloader could ever
          # have on disk: `sha256sum -c` failed 5/5 with "No such file or
          # directory", while the README makes that check the ONLY integrity proof
          # before telling Windows users to click through SmartScreen.
          # Fix: sanitize the names OURSELVES first, so what we hash is exactly
          # what GitHub serves and there is no mangling left to predict.
          for f in *; do
            [ -f "$f" ] || continue
            [ "$f" = SHA256SUMS ] && continue
            clean=$(printf '%s' "$f" | tr -c 'A-Za-z0-9._-' '.')
            if [ "$f" != "$clean" ]; then
              if [ -e "$clean" ]; then
                echo "::error::sanitized name collision: '$f' -> '$clean'"
                exit 1
              fi
              mv -- "$f" "$clean"
              echo "renamed: $f -> $clean"
            fi
          done
          # Hash into a path OUTSIDE this directory: writing the sums file here
          # while globbing it would race the glob against the redirect.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z \
            | xargs -0 -r sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          echo "SHA256SUMS:"; cat SHA256SUMS
          # Prove it verifies against the exact bytes we are about to upload —
          # a green run now means a user's `sha256sum -c` will also pass.
          sha256sum -c SHA256SUMS

      - name: Build updater manifest (latest.json)
        shell: bash
        env:
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: |
          set -euo pipefail
          cd all-installers
          # The updater endpoint in tauri.conf.json points at this file. It maps
          # each platform to a signed payload URL + its minisign signature.
          # MUST run AFTER the sanitize step above: the URLs have to be the names
          # GitHub actually serves, not the pre-upload ones.
          TAG="${GITHUB_REF_NAME}"
          # Belt and braces: the publish job's `if` already excludes
          # workflow_dispatch, so this cannot fire today. Keep both anyway, and
          # do NOT drop the job guard in favour of this skip. On its own it is
          # the shape that published installers with no manifest, because the
          # publish step below still runs and invents a manual-<date> tag.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "manual run — skipping latest.json (no real tag to point at)"
            exit 0
          fi
          TARGET_REPO="${RELEASES_REPO:-$GITHUB_REPOSITORY}"
          VERSION="${TAG#v}"

          shopt -s nullglob
          sigs=(*.sig)
          if [ ${#sigs[@]} -eq 0 ]; then
            # Unsigned build: TAURI_SIGNING_PRIVATE_KEY was not set. This used to
            # warn and exit 0, which published the installers with no latest.json
            # at all, the worst outcome available. The updater endpoint is
            # /releases/latest/download/latest.json, so the moment this release
            # becomes "latest" EVERY installed copy gets a 404 and goes
            # permanently dark, with no signal to the user or to us. Failing the
            # job instead leaves the previous release standing and still
            # updating. This is the posture docs/updater.md already argues for
            # ("Better to fail the release now, loudly").
            #
            # The recovery is to restore the signing secret and re-run ALL
            # jobs on the tag. NOT "Re-run failed jobs", which is what CLAUDE.md
            # tells you to do for a flaky leg: the build job SUCCEEDED here (it
            # just emitted no .sig), so that button restarts only this job,
            # which re-downloads the same unsigned artifacts and dies right
            # here again. The build leg is what has to run again.
            # It is deliberately NOT "publish it by hand":
            # a local `npm run tauri build` never loads
            # src-tauri/tauri.release.conf.json, so it emits no .sig either, and
            # a hand-uploaded release skips BOTH assertions this job exists for
            # (every matrix platform produced an installer, and latest.json
            # carries every platform key). That is this same failure reproduced
            # with the guard switched off, which is why the message below does
            # not offer it as a way out. If a build genuinely has to ship before
            # signing is fixed, it goes out marked prerelease so that
            # /releases/latest keeps resolving to the last SIGNED release and
            # the installed base keeps updating. See the release process in
            # CLAUDE.md.
            echo "::error::no .sig files found. TAURI_SIGNING_PRIVATE_KEY is probably unset, so there is nothing to build latest.json from. Refusing to publish: this release would become /releases/latest and every installed copy would 404 on the updater endpoint and never be offered another update. Restore the signing secret and re-run all jobs on the tag (not 'Re-run failed jobs': the build leg succeeded without a .sig, so re-running only this job re-downloads the same unsigned artifacts and fails here again). Do not upload this build by hand instead: that skips both of this job's completeness assertions and still ships no latest.json. If it must go out unsigned, mark it prerelease so /releases/latest stays on the last signed release. See docs/updater.md and the release process in CLAUDE.md."
            exit 1
          fi

          platforms='{}'
          for sig in "${sigs[@]}"; do
            payload="${sig%.sig}"
            if [ ! -f "$payload" ]; then
              echo "::warning::signature $sig has no matching payload $payload — skipping"
              continue
            fi
            # Platform keys must match what the RUNTIME asks for. The updater
            # builds its lookup key from cfg!(target_arch) at compile time, so a
            # lipo'd universal macOS binary resolves to darwin-aarch64 or
            # darwin-x86_64 depending on which slice is executing — NEVER
            # "darwin-universal". Publishing only that key made check() fail with
            # TargetsNotFound, which the UI could not distinguish from "no update
            # available", so macOS would silently never update. Emit BOTH arch
            # keys pointing at the same universal payload + signature.
            # Windows: Tauri v2 signs the .msi DIRECTLY (Pluto...msi + .msi.sig).
            # v1 shipped a zipped payload (.msi.zip), and matching only that shape
            # meant the windows key was silently omitted from latest.json on the
            # first real release — Windows would never have been offered an
            # update. Match both so either bundler shape works; .msi.zip is listed
            # first because *.msi would otherwise swallow it.
            case "$payload" in
              *.app.tar.gz) keys="darwin-aarch64 darwin-x86_64" ;;
              *.msi.zip)    keys="windows-x86_64" ;;
              *.msi)        keys="windows-x86_64" ;;
              *.nsis.zip)   keys="windows-x86_64" ;;
              *)            echo "::notice::ignoring non-updater artifact $payload"; continue ;;
            esac
            url="https://github.com/${TARGET_REPO}/releases/download/${TAG}/${payload}"
            for key in $keys; do
              platforms=$(jq -n --argjson p "$platforms" --arg k "$key" \
                --arg sig "$(cat "$sig")" --arg url "$url" \
                '$p + {($k): {signature: $sig, url: $url}}')
            done
          done

          if [ "$(jq -r 'length' <<<"$platforms")" = "0" ]; then
            # Same reasoning as the empty-sigs case above: no latest.json means
            # every installed copy 404s on the endpoint, so this cannot be a
            # warning either. Reaching here means the bundler changed payload
            # shapes and the case arms above need a new pattern.
            echo "::error::found .sig files but none matched a known updater payload, so latest.json would be empty. The bundler has probably changed artifact shapes: add the new pattern to the case arms above. Signatures present: ${sigs[*]}"
            exit 1
          fi

          jq -n --arg v "$VERSION" --arg notes "See the release notes for $TAG." \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: $p}' > latest.json
          echo "latest.json:"; cat latest.json

          # FAIL LOUDLY on a missing platform. A key that is simply absent is
          # invisible: the build goes green, the release looks complete, and that
          # platform silently never gets an update. Exactly that happened on the
          # first real release — the bundler emits .msi.sig (not the v1 .msi.zip
          # this step originally matched), so windows-x86_64 was omitted and only
          # the macOS keys shipped. Assert every platform this matrix builds.
          missing=""
          for want in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg k "$want" '.platforms | has($k)' latest.json >/dev/null || missing="$missing $want"
          done
          if [ -n "$missing" ]; then
            echo "::error::latest.json is missing platform key(s):$missing — those users would silently never be offered an update. Artifacts present: $(ls | tr '\n' ' ')"
            exit 1
          fi
          echo "all expected platform keys present"

      - name: Publish GitHub Release
        env:
          # Cross-repo publish to the public releases repo when configured,
          # otherwise publish to this repo with the built-in token.
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then TAG="manual-$(date +%Y%m%d-%H%M%S)"; fi
          TARGET_REPO="${RELEASES_REPO:-$GITHUB_REPOSITORY}"
          echo "Publishing $TAG to $TARGET_REPO"
          gh release create "$TAG" \
            --repo "$TARGET_REPO" \
            --title "Pluto's Terminal $TAG" \
            --notes "Download the installer for your platform below. macOS: .dmg, Windows: .msi. Builds are unsigned, so your OS may prompt on first launch; verify your download against the attached SHA256SUMS before running (see the README Install section)." \
            all-installers/* || \
          gh release upload "$TAG" --repo "$TARGET_REPO" --clobber all-installers/*
