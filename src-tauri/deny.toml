# (C) cargo-deny policy — added 2026-08-21 during the full audit.
#
# Why: `cargo audit` checks the RustSec advisory DB only. It does not check
# licenses, and this app ships a PROPRIETARY binary that statically vendors a
# large C/Rust dependency tree (OpenSSL, libssh2, libgit2, IronRDP, vnc-rs).
# A single GPL/AGPL crate in that tree is a licensing problem for a closed
# binary, and nothing in CI was looking for one.
#
# Posture: allow the standard permissive set, surface everything else. This is
# an AUDIT config — it is deliberately not tuned to pass.

[graph]
all-features = false

[licenses]
# Permissive / proprietary-binary-safe set.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "MPL-2.0",       # file-level copyleft; fine unmodified, flagged here on purpose
  "CDLA-Permissive-2.0",
  "NCSA",
]
confidence-threshold = 0.8
# The app crate itself is proprietary and unpublished; it has no SPDX license.
private = { ignore = true }

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[advisories]
# Advisories are gated in CI by cargo-audit already; keep this informational so
# the two tools do not disagree about the same residual set.
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
