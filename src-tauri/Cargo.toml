[package]
name = "plutos-terminals"
version = "0.1.0"
description = "Pluto's Terminals — multi-terminal desktop app for the Pluto AI YouTube community"
authors = ["Michael T. Cinnamon"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
chrono = "0.4"
portable-pty = "0.8"
rfd = "0.15"
