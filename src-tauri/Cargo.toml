[package]
name = "plutos-terminals"
version = "0.1.32"
description = "Pluto's Terminals — multi-terminal desktop app for the Pluto community"
authors = ["Michael T. Cinnamon"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
chrono = "0.4"
portable-pty = "0.8"
rfd = "0.15"
# vendored-openssl: build OpenSSL from source for the target arch. Avoids the
# Homebrew arch-mismatch (Intel openssl@3 vs arm64 binary) and, more importantly,
# makes release binaries self-contained — users don't need Homebrew's OpenSSL.
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
# OS-native credential store (macOS Keychain / Windows Credential Manager) for
# the SSH credential vault — secrets never touch localStorage or disk plaintext.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# Serial-port console sessions (USB/UART devices) — cross-platform.
serialport = "4"
# System stats (CPU / memory / disk) for the MobaXterm-style status bar.
sysinfo = "0.33"
