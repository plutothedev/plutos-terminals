[package]
name = "plutos-terminals"
version = "0.6.1"
description = "Pluto's Terminal — multi-terminal desktop app for the Pluto community"
authors = ["Michael T. Cinnamon"]
# Proprietary / source-available since v0.2.0 (versions <= v0.1.32 remain MIT).
license-file = "../LICENSE"
repository = "https://github.com/plutothedev/plutos-terminals"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
chrono = "0.4"
portable-pty = "0.8"
rfd = "0.15"
# vendored-openssl: build OpenSSL from source for the target arch. Avoids the
# Homebrew arch-mismatch (Intel openssl@3 vs arm64 binary) and, more importantly,
# makes release binaries self-contained — users don't need Homebrew's OpenSSL.
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
# OS-native credential store (macOS Keychain / Windows Credential Manager /
# Linux Secret Service) for the SSH credential vault — secrets never touch
# localStorage or disk plaintext.
# sync-secret-service is REQUIRED, not optional: with only the apple/windows
# features, keyring 3.x resolves `default` to its in-memory MOCK store on Linux
# ("fallback to mock if neither keyutils nor secret service is available",
# keyring-3.6.3/src/lib.rs), whose set/get both succeed while storing nothing.
# We ship .deb/.AppImage, so that silently ate every .deb/.AppImage user's
# provider keys, SSH passwords, gist PAT and cloud-sync passphrase on relaunch.
# sync (not async) per the crate's own guidance: our access is synchronous
# anyway, and async-secret-service would drag in zbus plus a runtime feature.
# crypto-rust encrypts secrets in transit across the session D-Bus in pure Rust,
# with no system OpenSSL (same reasoning as reqwest's rustls-tls below).
# Linux builds need libdbus present (build + run); it ships on any desktop that
# has a Secret Service implementation (GNOME Keyring / KWallet).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Serial-port console sessions (USB/UART devices) — cross-platform.
serialport = "4"
# System stats (CPU / memory / disk) for the MobaXterm-style status bar.
sysinfo = "0.39"
# HTTP client for the AI error explainer (calls the active LLM provider).
# rustls-tls (pure-Rust) avoids touching system OpenSSL — ssh2 already vendors
# its own, and mixing TLS backends invites the arm64 link mismatch we dodge.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# VNC remote-desktop client (sync RFB protocol; fits the worker-thread model).
vnc = "0.4"
# RDP remote-desktop client (IronRDP). Blocking I/O wrapper fits the worker-thread
# model; native-tls (macOS Security framework) keeps the binary self-contained.
ironrdp = { version = "0.14", features = ["connector", "session", "graphics", "input", "svc"] }
ironrdp-blocking = "0.8"
native-tls = "0.2"
# Extract the server's SubjectPublicKeyInfo (SPKI) from its TLS cert for CredSSP.
x509-cert = { version = "0.2", features = ["pem"] }
# SHA-256 fingerprints for RDP trust-on-first-use cert pinning (rdp.rs).
# Already in the tree transitively via p256 — zero new compilation units.
sha2 = "0.10"
# CredSSP NetworkClient trait (matches the version IronRDP uses).
sspi = "0.18"

# Phone/web companion — local HTTP + WebSocket server (Tailscale-reachable) for
# the remote-control feature. axum (ws) serves the built frontend + the control
# socket; tokio is the runtime (already pulled transitively); rand mints the
# device/pairing tokens. See companion.rs + docs/phone-companion-design.md.
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
rand = "0.8"
# Split the WebSocket into independent read/write halves (concurrent RPC replies +
# event relay) — already pulled transitively, named here so it's a stable dep.
futures-util = "0.3"
# Phase 5 (push-when-closed): Web Push with VAPID. hyper-client = tokio-native
# client (default isahc pulls libcurl — avoid). p256 generates the VAPID EC
# keypair; base64 (url-safe) encodes the scalar/public point for from_base64 +
# the browser applicationServerKey. Keys live in the OS keychain (vault.rs).
web-push = { version = "0.11", default-features = false, features = ["hyper-client"] }
p256 = "0.13"
base64 = "0.22"
# Global summon hotkey — show/hide the window from anywhere (Ctrl+Shift+`).
tauri-plugin-global-shortcut = "2"
# Cloud-sync git transport — moves two opaque encrypted files to/from a
# user-controlled git repo. Vendored libgit2 + openssl keep the binary
# self-contained; ssh feature enables SSH-agent auth. Encryption is done in JS;
# this layer never sees plaintext. See sync_git.rs.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "ssh"] }
# Model Context Protocol client (official SDK). stdio child-process + streamable
# HTTP transports for connecting to MCP servers; protocol/handshake handled here.
rmcp = { version = "1.7", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "client-side-sse"] }
# Remember window size/position/maximized across launches (geometry only —
# visibility is deliberately not tracked; see lib.rs).
tauri-plugin-window-state = "2.4.1"
# Signed auto-update. This is the channel that makes a security fix REACHABLE:
# without it a patch propagates only as a manual re-download through a
# SmartScreen/Gatekeeper warning, and never reaches an already-installed copy.
# Updates are minisign-verified against the pubkey in tauri.conf.json, so the
# release HOST is not trusted: a compromised CDN or repo still cannot ship code
# without the private key. `process` provides the relaunch after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"
