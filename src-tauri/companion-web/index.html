<!DOCTYPE html>
<!-- (C) Pluto's Terminal — phone/web companion (Phase 1). A self-contained page
     served by companion.rs: connects to the desktop over the tailnet WebSocket,
     mirrors a session's output and types into it. xterm + the app logic are
     VENDORED and served same-origin (no CDN) so the page runs under a strict CSP
     (script-src 'self'). On a hostile phone network a CDN/TLS-MITM injecting into
     the page that holds the shell token would be desktop RCE — same-origin closes
     that. See companion.rs index() for the CSP. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <title>Pluto Remote</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0b0d0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Pluto" />
  <link rel="stylesheet" href="/vendor/xterm.css" />
  <style>
    :root { --bg:#0b0d0f; --bar:#15181c; --line:#262b31; --cy:#3FC7C7; --fg:#cfd6dd; --dim:#6b7480; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100%; position:relative; }
    #bar { display:flex; align-items:center; gap:6px; padding:6px 8px; background:var(--bar);
      border-bottom:1px solid var(--line); overflow-x:auto; white-space:nowrap; flex-shrink:0; }
    #bar .brand { color:var(--cy); font-weight:700; font-size:13px; margin-right:4px; }
    .tab { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:6px;
      font-size:12px; color:var(--dim); border:1px solid transparent; cursor:pointer; }
    .tab.active { color:var(--fg); background:#1e2228; border-color:var(--line); }
    .tab .badge { font-size:11px; line-height:1; }
    #status { margin-left:auto; font-size:11px; color:var(--dim); padding-right:4px; }
    #status.ok { color:#6FB85C; } #status.err { color:#E05B5B; }
    #term { flex:1; min-height:0; padding:6px; }
    #term .xterm { height:100%; }
    /* File browser overlay (Phase 4) */
    #files { position:absolute; left:0; right:0; top:0; bottom:0; background:var(--bg);
      display:flex; flex-direction:column; z-index:5; }
    #filesbar { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--bar);
      border-bottom:1px solid var(--line); flex-shrink:0; }
    #filesbar button { background:#23272d; border:1px solid var(--line); color:var(--fg);
      border-radius:6px; padding:6px 10px; font-size:13px; }
    #filescd { color:var(--cy); margin-left:auto; }
    #filespath { font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap; flex:1; min-width:0; }
    #fileslist { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .frow { display:flex; align-items:center; gap:10px; padding:11px 12px; border-bottom:1px solid #15181c;
      font-size:14px; }
    .frow .fname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .frow .fsize { color:var(--dim); font-size:11px; }
    .frow .ficon { width:20px; text-align:center; }
    /* Snippets + model overlays (Phase 4) — share the file-browser shell */
    #snippets, #models { position:absolute; left:0; right:0; top:0; bottom:0; background:var(--bg);
      display:flex; flex-direction:column; z-index:5; }
    .ovbar { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--bar);
      border-bottom:1px solid var(--line); flex-shrink:0; }
    .ovbar .ovtitle { color:var(--cy); font-weight:600; font-size:14px; }
    .ovbar button { margin-left:auto; background:#23272d; border:1px solid var(--line); color:var(--fg);
      border-radius:6px; padding:6px 10px; font-size:13px; }
    .ovlist { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .srow { padding:11px 12px; border-bottom:1px solid #15181c; cursor:pointer; }
    .srow .sname { font-size:14px; color:var(--fg); }
    .srow .scmd { font-size:12px; color:var(--dim); font-family:Menlo,Monaco,monospace;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sfill { padding:10px 12px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
    .sfill input { padding:10px; border-radius:6px; border:1px solid var(--line); background:#15181c;
      color:var(--fg); font-size:16px; }
    .sfill .scmd { font-family:Menlo,Monaco,monospace; font-size:12px; color:var(--dim); word-break:break-all; }
    .sfill .sfrow { display:flex; gap:8px; }
    .sfill .sfrow button { flex:1; margin:0; padding:9px; border-radius:6px; border:1px solid var(--line);
      background:#23272d; color:var(--fg); font-size:14px; }
    .sfill .sfrow button.go { background:var(--cy); color:#06231a; border:none; font-weight:700; }
    .mgroup { padding:8px 12px 4px; font-size:11px; text-transform:uppercase; letter-spacing:0.4px;
      color:var(--dim); background:#101316; }
    .mrow { display:flex; align-items:center; gap:10px; padding:11px 12px; border-bottom:1px solid #15181c;
      font-size:14px; cursor:pointer; }
    .mrow.active { color:var(--cy); }
    .mrow .mcheck { width:18px; text-align:center; color:var(--cy); }
    .mrow .mname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    /* Login gate */
    #login { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:14px; background:var(--bg); padding:24px; text-align:center; }
    #login h1 { color:var(--cy); font-size:20px; margin:0; }
    #login p { color:var(--dim); font-size:13px; margin:0; max-width:320px; }
    #login input { width:min(320px,90%); padding:12px; border-radius:8px; border:1px solid var(--line);
      background:#15181c; color:var(--fg); font-size:16px; text-align:center; }
    #login button { padding:12px 20px; border-radius:8px; border:none; background:var(--cy);
      color:#06231a; font-weight:700; font-size:15px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div id="app" class="hidden">
    <div id="bar"><span class="brand">✦ Pluto</span><span id="tabs"></span><span id="snipbtn" class="tab" title="Snippets">📋</span><span id="modelbtn" class="tab" title="Model">✦</span><span id="filesbtn" class="tab" title="Browse files">📁</span><span id="newbtn" class="tab" title="New shell on the desktop">＋</span><span id="status">…</span></div>
    <div id="term"></div>
    <div id="files" class="hidden">
      <div id="filesbar">
        <button id="filesup" title="Up one level">↑</button>
        <span id="filespath">~</span>
        <button id="filescd" title="cd the active terminal here">cd here</button>
        <button id="filesclose" title="Close">✕</button>
      </div>
      <div id="fileslist"></div>
    </div>
    <div id="snippets" class="hidden">
      <div class="ovbar"><span class="ovtitle">📋 Snippets</span><button id="snipclose" title="Close">✕</button></div>
      <div id="sniplist" class="ovlist"></div>
    </div>
    <div id="models" class="hidden">
      <div class="ovbar"><span class="ovtitle">✦ Model</span><button id="modelclose" title="Close">✕</button></div>
      <div id="modellist" class="ovlist"></div>
    </div>
  </div>
  <div id="login">
    <h1>✦ Pluto Remote</h1>
    <p>Enter the access token shown on your desktop (or open the QR-code link, which fills it in).</p>
    <input id="token" type="text" inputmode="text" autocomplete="off" placeholder="access token" />
    <button id="connect">Connect</button>
    <p id="loginerr" style="color:#E05B5B"></p>
  </div>

  <!-- Vendored, same-origin, classic scripts (no CDN, no ESM, no inline) so the
       page satisfies a strict script-src 'self' CSP. xterm.js exposes the global
       `Terminal`; addon-fit.js exposes the `FitAddon` namespace. Order matters:
       the libraries must load before app.js, which uses those globals. -->
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
