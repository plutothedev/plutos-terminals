<!DOCTYPE html>
<!-- (C) Pluto's Terminal — phone/web companion (Phase 1). A self-contained page
     served by companion.rs: connects to the desktop over the tailnet WebSocket,
     mirrors a session's output and types into it. xterm loads from a CDN (the
     page is HTTP over the tailnet; an HTTPS CDN is allowed from an HTTP page). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <title>Pluto Remote</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
  <style>
    :root { --bg:#0b0d0f; --bar:#15181c; --line:#262b31; --cy:#3FC7C7; --fg:#cfd6dd; --dim:#6b7480; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow:hidden; }
    #app { display:flex; flex-direction:column; height:100%; }
    #bar { display:flex; align-items:center; gap:6px; padding:6px 8px; background:var(--bar);
      border-bottom:1px solid var(--line); overflow-x:auto; white-space:nowrap; flex-shrink:0; }
    #bar .brand { color:var(--cy); font-weight:700; font-size:13px; margin-right:4px; }
    .tab { padding:4px 10px; border-radius:6px; font-size:12px; color:var(--dim);
      border:1px solid transparent; cursor:pointer; }
    .tab.active { color:var(--fg); background:#1e2228; border-color:var(--line); }
    #status { margin-left:auto; font-size:11px; color:var(--dim); padding-right:4px; }
    #status.ok { color:#6FB85C; } #status.err { color:#E05B5B; }
    #term { flex:1; min-height:0; padding:6px; }
    #term .xterm { height:100%; }
    /* Login gate */
    #login { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:14px; background:var(--bg); padding:24px; text-align:center; }
    #login h1 { color:var(--cy); font-size:20px; margin:0; }
    #login p { color:var(--dim); font-size:13px; margin:0; max-width:320px; }
    #login input { width:min(320px,90%); padding:12px; border-radius:8px; border:1px solid var(--line);
      background:#15181c; color:var(--fg); font-size:16px; text-align:center; }
    #login button { padding:12px 20px; border-radius:8px; border:none; background:var(--cy);
      color:#06231a; font-weight:700; font-size:15px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div id="app" class="hidden">
    <div id="bar"><span class="brand">✦ Pluto</span><span id="tabs"></span><span id="status">…</span></div>
    <div id="term"></div>
  </div>
  <div id="login">
    <h1>✦ Pluto Remote</h1>
    <p>Enter the access token shown on your desktop (or open the QR-code link, which fills it in).</p>
    <input id="token" type="text" inputmode="text" autocomplete="off" placeholder="access token" />
    <button id="connect">Connect</button>
    <p id="loginerr" style="color:#E05B5B"></p>
  </div>

  <script type="module">
    import { Terminal } from "https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/+esm";
    import { FitAddon } from "https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/+esm";

    const $ = (id) => document.getElementById(id);
    const status = (t, cls) => { const s = $("status"); s.textContent = t; s.className = cls || ""; };

    let ws, rpcId = 0, pending = {}, subs = {}, currentId = null, currentTab = null;
    let term, fit;

    function rpc(cmd, args) {
      return new Promise((resolve, reject) => {
        const id = ++rpcId; pending[id] = { resolve, reject };
        ws.send(JSON.stringify({ type: "rpc", id, cmd, args: args || {} }));
      });
    }
    function subscribe(channel, cb) { subs[channel] = cb; ws.send(JSON.stringify({ type: "subscribe", channel })); }

    function initTerm() {
      term = new Terminal({ cursorBlink: true, fontSize: 13, fontFamily: "Menlo, Monaco, monospace",
        theme: { background: "#0b0d0f", foreground: "#cfd6dd" }, scrollback: 5000 });
      fit = new FitAddon(); term.loadAddon(fit);
      term.open($("term")); fit.fit();
      term.onData((d) => { if (currentId) rpc("pty_write", { id: currentId, data: d }); });
      window.addEventListener("resize", () => { try { fit.fit(); sendResize(); } catch {} });
    }
    function sendResize() { if (currentId && term) rpc("pty_resize", { id: currentId, cols: term.cols, rows: term.rows }).catch(() => {}); }

    // A session is { id, tabId, label, active }: `id` is the live pty channel id
    // (subscribe + write/resize); `tabId` is the scrollback key (history load).
    async function openSession(s) {
      if (!s || !s.id) return;
      currentId = s.id; currentTab = s.tabId || s.id;
      term.reset();
      try { const sb = await rpc("scrollback_load", { tabId: currentTab }); if (sb) term.write(sb); } catch {}
      subscribe("pty://" + s.id, (payload) => { if (currentId === s.id) term.write(payload); });
      try { fit.fit(); } catch {}
      sendResize();
      [...document.querySelectorAll(".tab")].forEach((el) => el.classList.toggle("active", el.dataset.id === s.id));
    }

    function renderTabs(sessions, activeId) {
      const c = $("tabs"); c.innerHTML = "";
      for (const s of sessions) {
        const el = document.createElement("span");
        el.className = "tab" + (s.id === activeId ? " active" : "");
        el.textContent = s.label || "shell"; el.dataset.id = s.id;
        el.onclick = () => openSession(s);
        c.appendChild(el);
      }
    }

    async function onReady() {
      status("connected", "ok");
      let sessions = [];
      try { sessions = (await rpc("list_sessions")) || []; } catch {}
      if (!Array.isArray(sessions)) sessions = [];
      if (!sessions.length) { status("no sessions on desktop", "err"); renderTabs([], null); return; }
      const active = sessions.find((s) => s.active) || sessions[0];
      renderTabs(sessions, active.id);
      openSession(active);
    }

    function connect(token) {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => ws.send(token);
      ws.onmessage = (e) => {
        let m; try { m = JSON.parse(e.data); } catch { return; }
        if (m.type === "ready") { $("login").classList.add("hidden"); $("app").classList.remove("hidden");
          if (!term) initTerm(); setTimeout(() => { try { fit.fit(); sendResize(); } catch {} }, 50); onReady(); }
        else if (m.type === "rpc-result") { const p = pending[m.id]; if (p) { delete pending[m.id]; ("err" in m) ? p.reject(m.err) : p.resolve(m.ok); } }
        else if (m.type === "event") { const cb = subs[m.channel]; if (cb) cb(m.payload); }
      };
      ws.onclose = () => { status("disconnected — reconnecting…", "err"); setTimeout(() => connect(token), 1500); };
      ws.onerror = () => {};
    }

    $("connect").onclick = () => { const t = $("token").value.trim(); if (t) { localStorage.setItem("pt_token", t); connect(t); } };
    $("token").addEventListener("keydown", (e) => { if (e.key === "Enter") $("connect").click(); });

    // Auto-connect if a token is in the URL hash (#<token>) or remembered.
    const hashToken = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
    const saved = localStorage.getItem("pt_token");
    if (hashToken) { $("token").value = hashToken; localStorage.setItem("pt_token", hashToken); connect(hashToken); }
    else if (saved) { $("token").value = saved; connect(saved); }
  </script>
</body>
</html>
